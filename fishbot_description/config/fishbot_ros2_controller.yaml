controller_manager:
  ros__parameters:
    update_rate: 100 # Hz
    use_sim_time: true

    fishbot_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    fishbot_effort_controller:
      type: effort_controllers/JointGroupEffortController
    fishbot_diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

fishbot_effort_controller:
  ros__parameters:
    joints:
      - wheel_left_joint
      - wheel_right_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
      - effort

fishbot_diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["wheel_left_joint"]
    right_wheel_names: ["wheel_right_joint"]

    wheel_separation: 0.20
    #wheels_per_side: 1  # actually 2, but both are controlled by 1 signal
    wheel_radius: 0.032

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]

    open_loop: false #用轮子实际转动计算里程计，true 时用速度指令积分，打滑/转向不足时误差大
    enable_odom_tf: true

    cmd_vel_timeout: 0.5
    #publish_limited_velocity: true
    use_stamped_vel: false
    #velocity_rolling_window_size: 10

    #加速度限制：速度指令突变时让轮速平滑变化，减少起步/刹车/转向时的打滑
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 0.5     #m/s^2，0 -> 0.5 m/s 约 1 秒
    linear.x.min_acceleration: -0.5    #减速
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 1.0    #rad/s^2，0 -> 1.0 rad/s 约 1 秒
    angular.z.min_acceleration: -1.0   #减速
